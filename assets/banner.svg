    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <g transform="translate(870 70)">
    <polygon points="0,120 120,0 240,0 120,120" fill="url(#shapeA)"/>
    <polygon points="120,120 240,120 120,240 0,240" fill="url(#shapeB)" transform="translate(40 0)"/>
    <polygon points="120,120 200,40 280,120 200,200" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="288" cy="196" r="6" fill="#3FD1FF"/>
    <circle cx="40" cy="60" r="4" fill="#6C8CFF"/>
  </g>
  <rect x="70" y="110" width="110" height="8" rx="4" fill="url(#accent)"/>
  <text x="66" y="215" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" fill="#FFFFFF">Youssef Esmail</text>
  <text x="70" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="500" fill="#9FDCF5">Junior Flutter Developer</text>
