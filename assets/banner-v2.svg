<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Youssef Esmail, Junior Flutter Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#0F2A43"/>
      <stop offset="1" stop-color="#0E4F6B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FD1FF"/>
      <stop offset="1" stop-color="#6C8CFF"/>
    </linearGradient>
    <linearGradient id="shapeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD1FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3FD1FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shapeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C8CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6C8CFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
    <clipPath id="reveal">
      <rect x="0" y="230" height="80" width="0">
        <animate attributeName="width" from="0" to="760" begin="0.6s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="-300" y="0" width="300" height="380" fill="url(#sheen)">
      <animate attributeName="x" from="-300" to="1200" dur="7s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(870 70)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/>
        <polygon points="0,120 120,0 240,0 120,120" fill="url(#shapeA)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="7s" repeatCount="indefinite"/>
        <polygon points="160,120 280,120 160,240 40,240" fill="url(#shapeB)"/>
      </g>
      <polygon points="120,120 200,40 280,120 200,200" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.85">
        <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="4s" repeatCount="indefinite"/>
      </polygon>
      <circle cx="288" cy="196" r="6" fill="#3FD1FF">
        <animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="60" r="4" fill="#6C8CFF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="70" y="110" width="0" height="8" rx="4" fill="url(#accent)">
      <animate attributeName="width" from="0" to="110" begin="0.1s" dur="0.7s" fill="freeze"/>
    </rect>
    <text x="66" y="215" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" fill="#FFFFFF" opacity="0">
      Youssef Esmail
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze"/>
    </text>
    <g clip-path="url(#reveal)">
      <text x="70" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="500" fill="#9FDCF5">Junior Flutter Developer</text>
    </g>
    <rect x="70" y="312" width="260" height="3" rx="1.5" fill="url(#accent)" opacity="0.0">
      <animate attributeName="opacity" values="0;0.9;0.2" begin="2s" dur="2.5s" fill="freeze"/>
    </rect>
  </g>
</svg>
