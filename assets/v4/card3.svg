<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Blood Bridge. Flutter team project: a blood donation app with Bloc, Firebase and maps. I worked on parts of it, including localization.">
