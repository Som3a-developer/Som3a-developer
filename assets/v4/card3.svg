<text x="70" y="142" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" fill="#B9B3A8">Flutter team project: a blood donation app</text><text x="70" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" fill="#B9B3A8">with Bloc, Firebase and maps. I worked on</text><text x="70" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" fill="#B9B3A8">parts of it, including localization.</text>

