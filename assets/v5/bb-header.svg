<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Blood Bridge. Flutter app connecting blood donors, recipients and hospitals">
<defs>
<radialGradient id="g" cx="0.95" cy="0" r="0.8"><stop offset="0" stop-color="#FF8A4C" stop-opacity="0.32"/><stop offset="1" stop-color="#FF8A4C" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1000" height="270" rx="24"/></clipPath>
<style>
.rise{animation:rise .55s cubic-bezier(.2,.75,.25,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}.d4{animation-delay:.4s}.d5{animation-delay:.52s}.d6{animation-delay:.62s}
.rule{transform-box:fill-box;transform-origin:left center;animation:draw .55s .5s cubic-bezier(.3,.8,.3,1) both}
.drop{transform-box:fill-box;transform-origin:center;animation:beat 2.8s ease-in-out infinite}
.ecg{stroke-dasharray:230;animation:ecg 2.8s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.05)}24%{transform:scale(1)}}
@keyframes ecg{0%{stroke-dashoffset:230;opacity:0}8%{opacity:1}55%{stroke-dashoffset:0;opacity:1}78%{opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
@media (prefers-reduced-motion: reduce){.rise,.rule,.drop,.ecg{animation:none}.ecg{opacity:1;stroke-dashoffset:0}}
</style>
</defs>
<g clip-path="url(#c)"><rect width="1000" height="270" fill="#0B0C12"/><rect width="1000" height="270" fill="url(#g)"/>
<circle cx="880" cy="130" r="108" fill="none" stroke="#FF8A4C" stroke-opacity="0.22" stroke-width="2"/>
<g class="rise d6">
<path class="drop" d="M880 62 C880 62 838 118 838 152 a42 42 0 1 0 84 0 C922 118 880 62 880 62 Z" fill="#FF8A4C" fill-opacity="0.14" stroke="#FF8A4C" stroke-opacity="0.85" stroke-width="2.5"/>
<path class="ecg" d="M848 152 h14 l6 -16 l9 32 l7 -24 l5 8 h34" fill="none" stroke="#FF8A4C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect width="8" height="270" fill="#FF8A4C"/>
<g class="rise d1"><text x="60" y="96" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#F4EFE6">Blood Bridge</text></g>
<rect class="rule" x="62" y="112" width="170" height="4" rx="2" fill="#FF8A4C"/>
<g class="rise d2"><text x="60" y="158" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" fill="#B9B3A8">Flutter app connecting donors, recipients and hospitals</text></g>
<g class="rise d3"><rect x="60" y="196" width="125" height="38" rx="19" fill="none" stroke="#FF8A4C" stroke-opacity="0.6" stroke-width="1.5"/><text x="122.5" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#F4EFE6">Flutter</text></g>
<g class="rise d4"><rect x="197" y="196" width="86" height="38" rx="19" fill="none" stroke="#FF8A4C" stroke-opacity="0.6" stroke-width="1.5"/><text x="240.0" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#F4EFE6">Bloc</text></g>
<g class="rise d5"><rect x="295" y="196" width="138" height="38" rx="19" fill="none" stroke="#FF8A4C" stroke-opacity="0.6" stroke-width="1.5"/><text x="364.0" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#F4EFE6">Firebase</text></g>
<g class="rise d6"><rect x="445" y="196" width="96" height="38" rx="19" fill="none" stroke="#FF8A4C" stroke-opacity="0.6" stroke-width="1.5"/><text x="493.0" y="221" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#F4EFE6">Maps</text></g>
</g></svg>
