<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Youssef Esmail, Junior Flutter Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#0F2A43"/>
      <stop offset="1" stop-color="#0E4F6B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FD1FF"/>
      <stop offset="1" stop-color="#6C8CFF"/>
    </linearGradient>
    <linearGradient id="shapeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD1FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3FD1FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shapeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C8CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6C8CFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
    <style>
      .float-a { animation: fa 6s ease-in-out infinite; }
      .float-b { animation: fb 7s ease-in-out infinite; }
      .pulse   { animation: pl 4s ease-in-out infinite; }
      .dot     { animation: dt 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sheen   { animation: sh 8s linear infinite; }
      .bar     { transform-box: fill-box; transform-origin: left center; animation: br 5s ease-in-out infinite; }
      @keyframes fa { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
      @keyframes fb { 0%,100% { transform: translateY(0) } 50% { transform: translateY(12px) } }
      @keyframes pl { 0%,100% { stroke-opacity: .35 } 50% { stroke-opacity: .95 } }
      @keyframes dt { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.7); opacity: .5 } }
      @keyframes sh { from { transform: translateX(0) } to { transform: translateX(1500px) } }
      @keyframes br { 0%,100% { transform: scaleX(.35); opacity: .5 } 50% { transform: scaleX(1); opacity: .95 } }
      @media (prefers-reduced-motion: reduce) {
        .float-a, .float-b, .pulse, .dot, .sheen, .bar { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect class="sheen" x="-300" y="0" width="300" height="380" fill="url(#sheen)"/>
    <g transform="translate(870 70)">
      <g class="float-a"><polygon points="0,120 120,0 240,0 120,120" fill="url(#shapeA)"/></g>
      <g class="float-b"><polygon points="160,120 280,120 160,240 40,240" fill="url(#shapeB)"/></g>
      <polygon class="pulse" points="120,120 200,40 280,120 200,200" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.85"/>
      <circle class="dot" cx="288" cy="196" r="6" fill="#3FD1FF"/>
      <circle cx="40" cy="60" r="4" fill="#6C8CFF"/>
    </g>
    <rect x="70" y="110" width="110" height="8" rx="4" fill="url(#accent)"/>
    <text x="66" y="215" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" fill="#FFFFFF">Youssef Esmail</text>
    <text x="70" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="500" fill="#9FDCF5">Junior Flutter Developer</text>
    <rect class="bar" x="70" y="312" width="260" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
</svg>
